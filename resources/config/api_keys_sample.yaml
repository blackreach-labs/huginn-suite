# Sample API Keys Configuration
# Copy this file to resources/config/api_keys.yaml and add your actual API keys

# Certificate Transparency Sources
certspotter: "your_certspotter_api_key_here"

# Search Engines & Databases  
virustotal: "your_virustotal_api_key_here"
censys_id: "your_censys_api_id_here"
censys_secret: "your_censys_api_secret_here"
shodan: "your_shodan_api_key_here"
securitytrails: "your_securitytrails_api_key_here"

# Threat Intelligence
binaryedge: "your_binaryedge_api_key_here"
passivetotal_user: "your_passivetotal_username_here"
passivetotal_key: "your_passivetotal_api_key_here"

# DNS & Network Intelligence
dnsdb: "your_farsight_dnsdb_api_key_here"

# Free Sources (no API key required)
# - crt.sh (Certificate Transparency)
# - Wayback Machine (Internet Archive)
# - URLScan.io (limited without key)

