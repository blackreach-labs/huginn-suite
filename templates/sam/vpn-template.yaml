AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Huginn VPN Servers

Parameters:
  InstanceCount:
    Type: Number
    Default: 1
  InstanceType:
    Type: String
    Default: t3.small

Resources:
  VPNSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Huginn VPN servers
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: 1194
          ToPort: 1194
          CidrIp: 0.0.0.0/0

  VPNLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: ami-0c02fb55956c7d316
        InstanceType: !Ref InstanceType
        SecurityGroupIds:
          - !Ref VPNSecurityGroup
        UserData:
          Fn::Base64: |
            #!/bin/bash
            yum update -y
            yum install -y openvpn easy-rsa
            systemctl enable openvpn
            systemctl start openvpn

  VPNAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      LaunchTemplate:
        LaunchTemplateId: !Ref VPNLaunchTemplate
        Version: !GetAtt VPNLaunchTemplate.LatestVersionNumber
      MinSize: !Ref InstanceCount
      MaxSize: !Ref InstanceCount
      DesiredCapacity: !Ref InstanceCount
      AvailabilityZones:
        Fn::GetAZs: !Ref AWS::Region

Outputs:
  SecurityGroupId:
    Value: !Ref VPNSecurityGroup
  AutoScalingGroupName:
    Value: !Ref VPNAutoScalingGroup